[project]
name = "optilir"
version = "0.1.0"
description = "OptiLIR, an intermediate representation of optimization requests: grammar, parser, prompts and a deterministic grounder"
readme = "README.md"
authors = [{name = "omelet-ai"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13.2,<3"]

[project.urls]
Repository = "https://github.com/omelet-ai/OptiLIR"
Dataset = "https://huggingface.co/datasets/omelet-ai/OptiLIR-Instruct-v1"

[project.optional-dependencies]
train = ["torch>=2.9", "transformers>=5.16", "accelerate>=1.14", "peft>=0.20", "trl>=1.12", "datasets>=5.0"]
eval = ["torch>=2.9", "transformers>=5.16", "accelerate>=1.14", "peft>=0.20", "datasets>=5.0", "xgrammar>=0.2.3"]
test = ["pytest>=9.0.3,<10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["execution_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Errors only: pyflakes and the pycodestyle syntax and statement checks.
select = ["E4", "E7", "E9", "F"]
